# Gerado por tools/dmpf-conformance/cmd/infrasync a partir de apps/backend/*/deploy/infra.json; não edite.
# Provisionamento da topologia de referência (ADR-044, ADR-052, ADR-053): banco e
# role de cada app no postgres-init, usuários, tópicos e ACLs no redpanda-init.
services:
  postgres-init:
    image: postgres:16-alpine
    profiles: [dmpf, provisioning]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: postgres
      GATEWAY_PG_PASSWORD: ${GATEWAY_PG_PASSWORD:-gateway-local}
      GATEWAY_PG_MIGRATOR_PASSWORD: ${GATEWAY_PG_MIGRATOR_PASSWORD:-gateway-migrator-local}
      PARTNER_PG_PASSWORD: ${PARTNER_PG_PASSWORD:-partner-local}
      PARTNER_PG_MIGRATOR_PASSWORD: ${PARTNER_PG_MIGRATOR_PASSWORD:-partner-migrator-local}
    entrypoint: ['/bin/sh', '-c']
    # Idempotente, e reconcilia as senhas a cada execução para que trocá-las com
    # o volume mantido não deixe a app sem conexão. Com database.migrator
    # (ADR-063), o banco pertence a <app>_migrator, e a role <app> não tem posse.
    command:
      - >-
        set -e; for pair in identity:${IDENTITY_PG_PASSWORD:-identity-local}; do
        app=$${pair%%:*}; pass=$${pair#*:};
        if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$$app'" | grep -q 1; then
        psql -c "CREATE ROLE \"$$app\" LOGIN"; fi;
        psql -c "ALTER ROLE \"$$app\" PASSWORD '$$pass'";
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$$app'" | grep -q 1; then
        psql -c "CREATE DATABASE \"$$app\" OWNER \"$$app\""; fi; done;
        if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'gateway_migrator'" | grep -q 1; then
        psql -c "CREATE ROLE \"gateway_migrator\" LOGIN"; fi;
        printf '%s\n' '\getenv pass GATEWAY_PG_MIGRATOR_PASSWORD' 'SET log_min_error_statement = panic;' 'SET log_statement = none;'
        "ALTER ROLE :\"role\" PASSWORD :'pass' LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;" | psql -v ON_ERROR_STOP=1 -v role=gateway_migrator;
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'gateway'" | grep -q 1; then
        psql -c "CREATE DATABASE \"gateway\" OWNER \"gateway_migrator\""; fi;
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'gateway' AND pg_get_userbyid(datdba) = 'gateway_migrator'" | grep -q 1; then
        psql -c "ALTER DATABASE \"gateway\" OWNER TO \"gateway_migrator\""; fi;
        psql -d "gateway" -c "GRANT CREATE ON SCHEMA public TO \"gateway_migrator\"";
        if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'gateway'" | grep -q 1; then
        psql -c "CREATE ROLE \"gateway\" LOGIN"; fi;
        printf '%s\n' '\getenv pass GATEWAY_PG_PASSWORD' 'SET log_min_error_statement = panic;' 'SET log_statement = none;'
        "ALTER ROLE :\"role\" PASSWORD :'pass' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;" | psql -v ON_ERROR_STOP=1 -v role=gateway;
        psql -c "GRANT CONNECT ON DATABASE \"gateway\" TO \"gateway\"";
        psql -c "REVOKE CONNECT ON DATABASE \"gateway\" FROM PUBLIC";
        psql -c "REVOKE TEMPORARY ON DATABASE \"gateway\" FROM PUBLIC";
        psql -d "gateway" -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC";
        psql -d "gateway" -c "REVOKE CREATE ON SCHEMA public FROM \"gateway\"";
        psql -d "gateway" -c "GRANT USAGE ON SCHEMA public TO \"gateway\"";
        if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'partner_migrator'" | grep -q 1; then
        psql -c "CREATE ROLE \"partner_migrator\" LOGIN"; fi;
        printf '%s\n' '\getenv pass PARTNER_PG_MIGRATOR_PASSWORD' 'SET log_min_error_statement = panic;' 'SET log_statement = none;'
        "ALTER ROLE :\"role\" PASSWORD :'pass' LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;" | psql -v ON_ERROR_STOP=1 -v role=partner_migrator;
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'partner'" | grep -q 1; then
        psql -c "CREATE DATABASE \"partner\" OWNER \"partner_migrator\""; fi;
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'partner' AND pg_get_userbyid(datdba) = 'partner_migrator'" | grep -q 1; then
        psql -c "ALTER DATABASE \"partner\" OWNER TO \"partner_migrator\""; fi;
        psql -d "partner" -c "GRANT CREATE ON SCHEMA public TO \"partner_migrator\"";
        if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'partner'" | grep -q 1; then
        psql -c "CREATE ROLE \"partner\" LOGIN"; fi;
        printf '%s\n' '\getenv pass PARTNER_PG_PASSWORD' 'SET log_min_error_statement = panic;' 'SET log_statement = none;'
        "ALTER ROLE :\"role\" PASSWORD :'pass' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;" | psql -v ON_ERROR_STOP=1 -v role=partner;
        psql -c "GRANT CONNECT ON DATABASE \"partner\" TO \"partner\"";
        psql -c "REVOKE CONNECT ON DATABASE \"partner\" FROM PUBLIC";
        psql -c "REVOKE TEMPORARY ON DATABASE \"partner\" FROM PUBLIC";
        psql -d "partner" -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC";
        psql -d "partner" -c "REVOKE CREATE ON SCHEMA public FROM \"partner\"";
        psql -d "partner" -c "GRANT USAGE ON SCHEMA public TO \"partner\""
    deploy:
      resources:
        limits: { cpus: '0.05', memory: 32M }
        reservations: { cpus: '0.01', memory: 16M }

  redpanda-init:
    image: redpandadata/redpanda:v26.2.2
    profiles: [dmpf, provisioning]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      RPK_USER: console
      RPK_PASS: ${KAFKA_CONSOLE_PASSWORD:-console-local}
      RPK_SASL_MECHANISM: SCRAM-SHA-256
      KAFKA_GATEWAY_PASSWORD: ${KAFKA_GATEWAY_PASSWORD:-gateway-local}
      KAFKA_IDENTITY_PASSWORD: ${KAFKA_IDENTITY_PASSWORD:-identity-local}
      KAFKA_PARTNER_PASSWORD: ${KAFKA_PARTNER_PASSWORD:-partner-local}
      KAFKA_CONSOLE_PASSWORD: ${KAFKA_CONSOLE_PASSWORD:-console-local}
    entrypoint: ['/bin/sh', '-c']
    # A ligação entre principal e source que o consumer admite é a ACL (ADR-052):
    # cada processo só escreve no próprio tópico e na DLQ que alimenta, e só quem
    # consome lê o tópico de outra app. A autorização liga por último, com as ACLs
    # já gravadas; o superusuário vazio é o principal do listener externo. Criar
    # usuário e tópico tolera o "já existe", mas a presença de cada um é conferida
    # antes das ACLs: qualquer falha interrompe o init sem ligar a autorização.
    command:
      - |
        set -eu
        admin="-X admin.hosts=redpanda:9644"
        broker="-X brokers=redpanda:29092"
        users=http://redpanda:9644/v1/security/users
        scram() {
          printf '{"username":"%s","password":"%s","algorithm":"SCRAM-SHA-256"}' "$$2" "$$3" |
            curl -sS -o /dev/null -w '%{http_code}' -X "$$1" -H 'Content-Type: application/json' --data-binary @- "$$4"
        }
        create_user() {
          case $$2 in
            *[[:cntrl:]]*) echo "redpanda-init: a senha do usuário $$1 tem caractere de controle" >&2; exit 1 ;;
          esac
          pass=$$(printf '%s' "$$2" | sed 's/["\\]/\\&/g')
          status=$$(scram POST "$$1" "$$pass" "$$users") || status=000
          if [ "$$status" = 500 ] && rpk security user list $$admin | grep -qx "$$1"; then
            status=$$(scram PUT "$$1" "$$pass" "$$users/$$1") || status=000
          fi
          case $$status in
            2??) ;;
            *) echo "redpanda-init: a Admin API recusou o usuário $$1 com status $$status" >&2; exit 1 ;;
          esac
        }
        create_user gateway "$$KAFKA_GATEWAY_PASSWORD"
        create_user identity "$$KAFKA_IDENTITY_PASSWORD"
        create_user partner "$$KAFKA_PARTNER_PASSWORD"
        create_user console "$$KAFKA_CONSOLE_PASSWORD"
        for user in gateway identity partner console; do
          rpk security user list $$admin | grep -qw "$$user"
        done
        rpk cluster config set superusers '["console",""]' $$admin
        rpk topic create ${KAFKA_GATEWAY_TOPIC:-gateway.events} ${KAFKA_GATEWAY_DLQ:-gateway.events.dlq} ${KAFKA_GATEWAY_DISPATCH_TOPIC:-gateway.dispatch} ${KAFKA_GATEWAY_DISPATCH_DLQ:-gateway.dispatch.dlq} ${KAFKA_IDENTITY_TOPIC:-identity.events} ${KAFKA_IDENTITY_DLQ:-identity.events.dlq} ${KAFKA_PARTNER_TOPIC:-partner.events} ${KAFKA_PARTNER_DLQ:-partner.events.dlq} $$broker -p 1 -r 1 || true
        for topic in ${KAFKA_GATEWAY_TOPIC:-gateway.events} ${KAFKA_GATEWAY_DLQ:-gateway.events.dlq} ${KAFKA_GATEWAY_DISPATCH_TOPIC:-gateway.dispatch} ${KAFKA_GATEWAY_DISPATCH_DLQ:-gateway.dispatch.dlq} ${KAFKA_IDENTITY_TOPIC:-identity.events} ${KAFKA_IDENTITY_DLQ:-identity.events.dlq} ${KAFKA_PARTNER_TOPIC:-partner.events} ${KAFKA_PARTNER_DLQ:-partner.events.dlq}; do
          rpk topic describe "$$topic" $$broker >/dev/null
        done
        rpk security acl create --allow-principal User:gateway --operation write,describe --topic ${KAFKA_GATEWAY_TOPIC:-gateway.events} --topic ${KAFKA_GATEWAY_DLQ:-gateway.events.dlq} --topic ${KAFKA_GATEWAY_DISPATCH_TOPIC:-gateway.dispatch} --topic ${KAFKA_GATEWAY_DISPATCH_DLQ:-gateway.dispatch.dlq} --topic ${KAFKA_PARTNER_DLQ:-partner.events.dlq} $$broker
        rpk security acl create --allow-principal User:gateway --operation read,describe --topic ${KAFKA_PARTNER_TOPIC:-partner.events} --group ${KAFKA_GROUP:-gateway} $$broker
        rpk security acl create --allow-principal User:identity --operation write,describe --topic ${KAFKA_IDENTITY_TOPIC:-identity.events} --topic ${KAFKA_IDENTITY_DLQ:-identity.events.dlq} $$broker
        rpk security acl create --allow-principal User:partner --operation write,describe --topic ${KAFKA_PARTNER_TOPIC:-partner.events} --topic ${KAFKA_PARTNER_DLQ:-partner.events.dlq} $$broker
        rpk cluster config set kafka_enable_authorization true $$admin
    deploy:
      resources:
        limits: { cpus: '0.05', memory: 64M }
        reservations: { cpus: '0.01', memory: 16M }
