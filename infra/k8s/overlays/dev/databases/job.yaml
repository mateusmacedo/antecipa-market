# Gerado por tools/dmpf-conformance/cmd/infrasync a partir de apps/backend/*/deploy/infra.json; não edite.
# Idempotente, então reaplicar o overlay não falha; os `api` reiniciam até o
# banco existir. Com database.migrator (ADR-063), o banco pertence a
# <app>_migrator, e a role <app> não tem posse.
apiVersion: batch/v1
kind: Job
metadata:
  name: databases
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-databases
          image: postgres:16-alpine
          command: ['sh', '-c']
          args:
            - >-
              set -e; until pg_isready; do sleep 2; done;
              for pair in identity:$IDENTITY_PG_PASSWORD; do
              app=${pair%%:*}; pass=${pair#*:};
              if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$app'" | grep -q 1; then
              psql -c "CREATE ROLE \"$app\" LOGIN"; fi;
              psql -c "ALTER ROLE \"$app\" PASSWORD '$pass'";
              if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$app'" | grep -q 1; then
              psql -c "CREATE DATABASE \"$app\" OWNER \"$app\""; fi; done;
              if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'partner_migrator'" | grep -q 1; then
              psql -c "CREATE ROLE \"partner_migrator\" LOGIN"; fi;
              printf '%s\n' '\getenv pass PARTNER_PG_MIGRATOR_PASSWORD' 'SET log_min_error_statement = panic;' 'SET log_statement = none;'
              "ALTER ROLE :\"role\" PASSWORD :'pass' LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;" | psql -v ON_ERROR_STOP=1 -v role=partner_migrator;
              if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'partner'" | grep -q 1; then
              psql -c "CREATE DATABASE \"partner\" OWNER \"partner_migrator\""; fi;
              if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'partner' AND pg_get_userbyid(datdba) = 'partner_migrator'" | grep -q 1; then
              psql -c "ALTER DATABASE \"partner\" OWNER TO \"partner_migrator\""; fi;
              psql -d "partner" -c "GRANT CREATE ON SCHEMA public TO \"partner_migrator\"";
              if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'partner'" | grep -q 1; then
              psql -c "CREATE ROLE \"partner\" LOGIN"; fi;
              printf '%s\n' '\getenv pass PARTNER_PG_PASSWORD' 'SET log_min_error_statement = panic;' 'SET log_statement = none;'
              "ALTER ROLE :\"role\" PASSWORD :'pass' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;" | psql -v ON_ERROR_STOP=1 -v role=partner;
              psql -c "GRANT CONNECT ON DATABASE \"partner\" TO \"partner\"";
              psql -c "REVOKE CONNECT ON DATABASE \"partner\" FROM PUBLIC";
              psql -c "REVOKE TEMPORARY ON DATABASE \"partner\" FROM PUBLIC";
              psql -d "partner" -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC";
              psql -d "partner" -c "REVOKE CREATE ON SCHEMA public FROM \"partner\"";
              psql -d "partner" -c "GRANT USAGE ON SCHEMA public TO \"partner\""
          env:
            - name: PGHOST
              value: postgres-0.postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_DB
            - name: IDENTITY_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: databases
                  key: identity
            - name: PARTNER_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: databases
                  key: partner
            - name: PARTNER_PG_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: databases
                  key: partner_migrator
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
