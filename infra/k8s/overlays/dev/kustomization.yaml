apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev: tudo no cluster, sem TLS no Kafka nem no gRPC interno; banco e role vêm do Job
# databases, e o schema, do MIGRATE do papel api. Credenciais só de desenvolvimento.

namespace: dmpf-dev

resources:
  - ../../base/postgres
  - ../../base/redpanda
  - ../../base/redis
  - ../../../observability
  - ../../../keycloak
  - apps
  - databases

components:
  - ../../../keycloak/dev

secretGenerator:
  - name: grafana-admin
    literals:
      - password=admin
    options:
      disableNameSuffixHash: true
  - name: redis
    files:
      - users.acl=redis-users.acl
    literals:
      - url=redis://revocation:dmpf-dev-revocation@redis:6379/0
    options:
      disableNameSuffixHash: true
