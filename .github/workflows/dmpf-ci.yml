name: DMPF CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  dmpf:
    name: DMPF
    uses: mateusmacedo/dmpf/.github/workflows/dmpf-go-ci.yml@25f0fda1e3ecab29582e1c85cb4df4e35478e154
    with:
      plugin-version: "1.0.0-rc.8"
