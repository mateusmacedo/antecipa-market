name: DMPF CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  dmpf:
    name: DMPF
    uses: mateusmacedo/dmpf/.github/workflows/dmpf-go-ci.yml@b5131eea0ce4c593e11e39f339ea9daea1f53ce4
    with:
      plugin-version: "1.0.0-rc.5"
