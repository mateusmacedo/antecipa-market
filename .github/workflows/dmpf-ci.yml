name: DMPF CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  dmpf:
    name: DMPF
    uses: mateusmacedo/dmpf/.github/workflows/dmpf-go-ci.yml@487e9de17099c0eb8d44e3e9c2dfbd58b577b958
    with:
      plugin-version: "1.0.0-rc.4"
