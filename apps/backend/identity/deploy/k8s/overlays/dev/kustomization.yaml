apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/mateusmacedo/identity
    newTag: dev

secretGenerator:
  - name: identity
    literals:
      - PG_DSN=postgres://identity:identity-dev@postgres-0.postgres:5432/identity?sslmode=disable
      - KAFKA_BROKERS=redpanda-0.redpanda:9092
    options:
      disableNameSuffixHash: true

patches:
  - path: configmap-identity-patch.yaml
  - path: deployment-identity-api-patch.yaml
