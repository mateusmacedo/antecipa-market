syntax = "proto3";

package company.partner.event.v1;

import "company/partner/event/v1/types.proto";
import "google/protobuf/timestamp.proto";

message CapabilityEnabled {
  string capability_id = 1;
  string partner_id = 2;
  string operation = 3;
  string asset_type = 4;
  Environment environment = 5;
  int32 version = 6;
  RolloutMode rollout_mode = 7;
  bool state_query_supported = 8;
  string restriction_note = 9;
  google.protobuf.Timestamp at = 10;
}
