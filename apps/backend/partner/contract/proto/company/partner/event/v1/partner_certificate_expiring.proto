syntax = "proto3";

package company.partner.event.v1;

import "company/partner/event/v1/types.proto";
import "google/protobuf/timestamp.proto";

message PartnerCertificateExpiring {
  string profile_id = 1;
  string partner_id = 2;
  Environment environment = 3;
  google.protobuf.Timestamp certificate_expires_at = 4;
  int32 threshold_days = 5;
  google.protobuf.Timestamp at = 6;
}
