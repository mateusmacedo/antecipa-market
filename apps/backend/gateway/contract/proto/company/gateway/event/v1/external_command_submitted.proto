syntax = "proto3";

package company.gateway.event.v1;

import "google/protobuf/timestamp.proto";

// An external command was sent to its partner once more.
// Envelope type: com.company.gateway.external-command-submitted.v1 (PTB-03).
message ExternalCommandSubmitted {
  string idempotency_key = 1;
  // The business tenant that originated the command, data in phase 1.
  string tenant_id = 2;
  string connector_id = 3;
  string operation = 4;
  string business_key = 5;
  int32 submission = 6;
  google.protobuf.Timestamp at = 7;
}
