syntax = "proto3";

package company.gateway.event.v1;

// UNSPECIFIED is no category: the last attempt ended accepted.
enum FailureCategory {
  FAILURE_CATEGORY_UNSPECIFIED = 0;
  FAILURE_CATEGORY_FINAL_VALIDATION = 1;
  FAILURE_CATEGORY_FINAL_BUSINESS = 2;
  FAILURE_CATEGORY_FINAL_AUTHORIZATION = 3;
  FAILURE_CATEGORY_UNKNOWN_SENT = 4;
  FAILURE_CATEGORY_UNKNOWN_AMBIGUOUS = 5;
  FAILURE_CATEGORY_SCHEMA_MISMATCH = 6;
}

enum ConfirmationSource {
  CONFIRMATION_SOURCE_UNSPECIFIED = 0;
  CONFIRMATION_SOURCE_SUBMIT_RESPONSE = 1;
  CONFIRMATION_SOURCE_STATE_QUERY = 2;
  CONFIRMATION_SOURCE_CALLBACK = 3;
  CONFIRMATION_SOURCE_FILE = 4;
  CONFIRMATION_SOURCE_HUMAN = 5;
}

enum WaitingStatus {
  WAITING_STATUS_UNSPECIFIED = 0;
  WAITING_STATUS_ACKNOWLEDGED = 1;
  WAITING_STATUS_UNKNOWN_OUTCOME = 2;
}
