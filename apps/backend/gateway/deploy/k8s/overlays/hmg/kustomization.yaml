apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/mateusmacedo/gateway
    newTag: hmg

replicas:
  - name: gateway-api
    count: 2

patches:
  - path: configmap-gateway-patch.yaml
  - path: deployment-gateway-api-patch.yaml
  - path: deployment-gateway-relay-patch.yaml
  - path: deployment-gateway-consumer-patch.yaml
