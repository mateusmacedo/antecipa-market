apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/mateusmacedo/gateway
    newTag: dev

secretGenerator:
  - name: gateway
    literals:
      - PG_DSN=postgres://gateway:gateway-dev@postgres-0.postgres:5432/gateway?sslmode=disable
      - KAFKA_BROKERS=redpanda-0.redpanda:9092
    options:
      disableNameSuffixHash: true
  - name: gateway-migrator
    literals:
      - PG_MIGRATE_DSN=postgres://gateway_migrator:gateway-migrator-dev@postgres-0.postgres:5432/gateway?sslmode=disable
    options:
      disableNameSuffixHash: true

patches:
  - path: configmap-gateway-patch.yaml
  - path: deployment-gateway-api-patch.yaml
