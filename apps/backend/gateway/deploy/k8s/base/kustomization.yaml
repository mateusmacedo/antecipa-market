apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Contexto gateway: api gRPC, relay e consumer como Deployments de uma mesma
# imagem. Os Secrets `gateway` (PG_DSN, KAFKA_BROKERS) e `gateway-migrator`
# (PG_MIGRATE_DSN, só do api) vêm do overlay.

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/part-of: dmpf

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment-api.yaml
  - deployment-relay.yaml
  - deployment-consumer.yaml
  - service-api.yaml
  - pdb-api.yaml
  - networkpolicy.yaml
